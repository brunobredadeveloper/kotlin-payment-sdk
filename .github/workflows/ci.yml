name: SDK and Android demo
on: [push, pull_request]
permissions:
 contents: read
jobs:
 sdk:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: gradle/actions/setup-gradle@v4
   - run: ./gradlew :sdk:test :sdk:publishToMavenLocal
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: sdk-test-reports
      path: sdk/build/reports/tests/test
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
   - uses: gradle/actions/setup-gradle@v4
   - run: ./gradlew -PincludeAndroid=true :sample-android:lintDebug :sample-android:assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: payment-sdk-demo-apk
      path: sample-android/build/outputs/apk/debug/*.apk
